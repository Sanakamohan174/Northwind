name: LinkedIn job alert

on:
  schedule:
    - cron: "7 * * * *" # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-job-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r linkedin_jobs/requirements.txt

      - name: Check for new jobs and send to WhatsApp
        working-directory: linkedin_jobs
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python job_alert.py

      - name: Save seen jobs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add linkedin_jobs/state/seen_jobs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update seen LinkedIn jobs"
          git pull --rebase
          git push
